<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>In Falsus 哈农</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="stage"></div><header><a class="brand" href="/">In Falsus<span>哈农</span></a><div class="header-right"><span class="status"><i></i>6-KEY STUDIO</span><button id="fullscreen" title="全屏"><i data-lucide="maximize"></i></button></div></header>
<main id="setup"><aside class="settings"><div class="tabs"><button data-tab="chart" class="active">谱面编排</button><button data-tab="judge">判定设置</button><button data-tab="keys">键位与声音</button></div>
<section id="tab-chart" class="tab-content"><div class="section-heading"><h2>练习序列</h2><span id="queue-count"></span></div><div id="library"></div><ol id="queue"></ol><div class="grid2"><label>上下行各重复<input id="repeat" type="number" min="1" max="100" value="2"></label><label>BPM<input id="bpm" type="number" min="20" max="400" value="75"></label></div><div class="field"><span>音符时值</span><div id="division" class="segmented"></div></div><label class="field">流速 <output id="speed-value"></output><input id="speed" type="range" min="4" max="100" step="0.5"></label><label class="field">轨道倾角 <output id="slope-value"></output><input id="slope" type="range" min="10" max="35" step="1"></label><label class="field">两侧抬起角度 <output id="wingAngle-value"></output><input id="wingAngle" type="range" min="0" max="50" step="1"></label><div class="summary"><span id="note-count"></span><span id="duration"></span></div></section>
<section id="tab-judge" class="tab-content" hidden><div class="section-heading"><h2>判定区间</h2><label class="zoom">缩放<input id="zoom" type="range" min="150" max="1000" step="10" value="300"></label></div><div id="axis"></div><div class="add-boundary"><input id="new-boundary" type="number" min="1" max="2000" value="200" aria-label="新增端点毫秒数" aria-describedby="boundary-hint"><span>ms</span><button id="add-boundary" title="添加端点"><i data-lucide="plus"></i></button></div><p id="boundary-hint" class="field-hint">输入毫秒数，点击 + 新增判定端点。</p><div id="windows"></div><label class="field">输入偏移（ms）<input id="offset" type="number" min="-300" max="300" value="0"></label></section>
<section id="tab-keys" class="tab-content" hidden><h2>轨道键位</h2><div id="bindings"></div><label class="toggle">背景音乐<input id="sound" type="checkbox" checked></label><label class="toggle">命中按键音<input id="hitSound" type="checkbox" checked></label><label class="toggle">节拍器<input id="metronome" type="checkbox"></label><label class="field">音量<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3"></label><button id="reset" class="secondary">恢复默认设置</button></section>
<p id="error" role="alert"></p><button id="start" class="primary"><i data-lucide="play"></i>开始练习<span id="start-meta"></span></button></aside><div class="scene-caption"><span>01 — PRACTICE SPACE</span><span>6 LANES / INFINITE REPETITIONS</span></div></main>
<div id="hud" hidden><div class="score-block"><span>SCORE</span><strong id="score">0000000</strong><small id="accuracy">100.00%</small></div><div class="song-block"><span id="current">HANON 01</span><small id="phase"></small><button id="pause" title="暂停"><i data-lucide="pause"></i></button></div><div id="combo"></div><div id="progress"><div></div></div></div><div id="lane-labels"></div><div id="effects"></div><div id="countdown"></div>
<div id="overlay" hidden><div class="modal"><span class="eyebrow" id="modal-tag">SESSION PAUSED</span><h2 id="modal-title">暂停练习</h2><div id="results"></div><button id="resume" class="primary"><i data-lucide="play"></i>继续练习</button><button id="restart" class="secondary"><i data-lucide="rotate-ccw"></i>重新开始</button><button id="back" class="text-button">返回编排</button></div></div><script type="module" src="/app.js"></script></body></html>
